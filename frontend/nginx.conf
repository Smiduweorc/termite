server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	# index.html carries the API_URL that docker-entrypoint.sh injected at container
	# start, so it is the one file here that must never be cached. A stale copy held by
	# a browser or an upstream proxy would point users at the previous deployment's
	# backend, and the failure looks like CORS errors rather than a caching bug.
	location = /index.html {
		add_header Cache-Control "no-store" always;
		try_files $uri =404;
	}

	# Vite fingerprints these (app.4f2a1c.js), so the filename changes whenever the
	# content does. A year-long immutable cache can never go stale.
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	# A single-page app owns its own routing: any path that is not a real file has to
	# come back as index.html, or a refresh on a client-side route 404s from nginx
	# before Vue ever sees it.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Answered by nginx itself, so it reports whether *this* container is serving files.
	# It deliberately says nothing about the backend: that is the backend's /health, and
	# conflating the two makes a healthy frontend look broken during a backend restart.
	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
