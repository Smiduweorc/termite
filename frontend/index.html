<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/png" href="/termite.png" />
		<!-- Paints the browser chrome the same wood, so the page has no pale collar. -->
		<meta name="theme-color" content="#211d17" />
		<title>Termite</title>
	</head>
	<body>
		<div id="app"></div>
		<!--
			Runtime configuration, read by src/lib/trpc.ts. The value is a placeholder that
			the Docker image's entrypoint rewrites on container start; `vite dev` and a
			plain `vite build` leave it exactly as it is, and trpc.ts recognises the
			unsubstituted form and falls back. Inline and synchronous on purpose - fetching
			a config.json instead would make client construction async and drag that
			awaitness through every consumer.
		-->
		<script>
			window.__TERMITE__ = { apiUrl: "__TERMITE_API_URL__" };
		</script>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
