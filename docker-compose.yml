services:
  postgres:
    image: postgres:17-alpine
    container_name: bevd-base-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bevd
      POSTGRES_PASSWORD: bevd
      POSTGRES_DB: bevd
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bevd -d bevd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
