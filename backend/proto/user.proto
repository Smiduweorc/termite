syntax = "proto3";

package termite.user.v1;

import "auth.proto";

// Admin only, every method. A missing token is UNAUTHENTICATED; a valid token belonging
// to an ordinary user is PERMISSION_DENIED.
service UserService {
	rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
	// The only way an account is created. It gets no usable password - the invite link
	// that goes out by mail is what sets the first one.
	rpc CreateUser(CreateUserRequest) returns (termite.auth.v1.User);
	rpc ResendInvite(ResendInviteRequest) returns (termite.auth.v1.OkResponse);
	rpc SetUserRole(SetUserRoleRequest) returns (termite.auth.v1.User);
	rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}

message ListUsersRequest {}

message CreateUserRequest {
	string email = 1;
	string name = 2;
	// "user" or "admin". Empty means "user".
	string role = 3;
}

message ResendInviteRequest {
	string user_id = 1;
}

message ListUsersResponse {
	repeated termite.auth.v1.User users = 1;
}

message SetUserRoleRequest {
	string user_id = 1;
	// "user" or "admin".
	string role = 2;
}

message DeleteUserRequest {
	string user_id = 1;
}

message DeleteUserResponse {
	string id = 1;
}
